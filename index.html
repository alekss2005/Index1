<!DOCTYPE html>
<html lang="uk" data-theme="military">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KYIV OSINT RADAR v15.4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root,[data-theme="military"]{--bg:#050a10;--panel:rgba(8,16,24,.92);--panel-solid:#0b1520;--text:#e8f0f5;--muted:#7a8f9e;--accent:#22d3ee;--accent-soft:rgba(34,211,238,.15);--danger:#ef4444;--ok:#34d399;--warn:#fbbf24;--border:rgba(34,211,238,.18);--header-bg:rgba(5,10,16,.94);--btn-bg:rgba(12,22,32,.9);--btn-border:rgba(148,163,184,.22);--event-border:#132028;--glow:0 0 12px rgba(34,211,238,.35);--radius:12px;--font:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font-ui);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.header{min-height:42px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:6px 12px;padding-top:calc(6px + var(--safe-top));z-index:1000;backdrop-filter:blur(16px);flex:0 0 auto;font-size:12px;gap:8px}
.logo{font-weight:800;letter-spacing:.06em;font-size:11px;display:flex;align-items:center;gap:7px;font-family:var(--font)}
.logo-icon{font-size:14px;filter:drop-shadow(0 0 6px var(--accent))}
.header-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.search-box{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:999px;overflow:hidden;height:32px;flex:1;max-width:260px;min-width:100px}
.search-box input{background:transparent;border:0;color:var(--text);padding:0 12px;font-size:12px;width:100%;outline:none;font-family:var(--font-ui)}
.search-box input::placeholder{color:var(--muted)}
.search-box button{background:transparent;border:0;color:var(--accent);width:34px;height:32px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lang-btn-header{background:var(--btn-bg);border:1px solid var(--border);color:var(--accent);border-radius:999px;font-size:11px;font-weight:800;min-width:34px;width:34px;height:32px;cursor:pointer;font-family:var(--font)}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-weight:700;font-family:var(--font);letter-spacing:.04em}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status-dot.err{background:var(--danger);box-shadow:0 0 10px var(--danger)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.search-results{position:absolute;top:calc(48px + var(--safe-top));right:10px;left:10px;z-index:5000;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:400px;margin-left:auto;max-height:260px;overflow-y:auto;width:280px;display:none}
.search-results.show{display:block}
.search-item{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid rgba(148,163,184,.12)}
.search-item .name{font-weight:700}
.search-item .addr{font-size:10px;color:var(--muted);margin-top:2px}
#map{flex:1;min-height:0;width:100%;background:var(--bg)}
.top-alert{position:absolute;top:calc(48px + var(--safe-top) + 8px);left:6px;right:6px;z-index:4600;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.top-alert.show{display:block;animation:alertIn .3s ease-out}
@keyframes alertIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.top-alert.ballistic{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d);color:#fff;animation:bbPulse .6s ease-in-out infinite;border:1px solid #fca5a5}
@keyframes bbPulse{0%,100%{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d)}50%{background:linear-gradient(90deg,#dc2626,#fca5a5,#dc2626)}}
.top-alert.target{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12);color:#fff;border:1px solid #fdba74;animation:targetPulse 1.2s ease-in-out infinite}
@keyframes targetPulse{0%,100%{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12)}50%{background:linear-gradient(90deg,#ea580c,#fdba74,#ea580c)}}
.top-alert.impact{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert.shot{background:linear-gradient(90deg,#14532d,#16a34a,#14532d);color:#fff;border:1px solid #86efac}
.top-alert.fire{background:linear-gradient(90deg,#7c2d12,#f97316,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert-inner{padding:9px 34px 9px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:.86rem;line-height:1.25}
.top-alert-icon{font-size:1.4rem;flex-shrink:0}
.top-alert-body{flex:1;min-width:0}
.top-alert-title{font-weight:800;font-size:.86rem}
.top-alert-place{font-size:.78rem;font-weight:700;margin-top:2px;opacity:.95}
.top-alert-meta{font-size:.68rem;font-weight:700;opacity:.85;margin-top:2px}
.top-alert-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.25);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.mass-banner{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4620;border-radius:10px;overflow:hidden;display:none;background:linear-gradient(135deg,#4c1d95,#7c3aed,#4c1d95);border:1px solid #c4b5fd;color:#fff}
.mass-banner.show{display:block;animation:alertIn .3s ease-out}
.mass-banner-inner{padding:10px 34px 10px 12px;display:flex;align-items:flex-start;gap:10px;font-weight:700;font-size:.8rem;line-height:1.35}
.mass-banner-icon{font-size:1.5rem;flex-shrink:0}
.mass-banner-body{flex:1;min-width:0}
.mass-banner-title{font-weight:800;font-size:.86rem}
.mass-banner-line{font-size:.74rem;font-weight:700;margin-top:3px}
.mass-banner-line b{color:#fde047}
.mass-banner-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.3);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.panel{position:absolute;left:6px;right:6px;bottom:calc(54px + var(--safe-bottom));background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;z-index:900;display:flex;flex-direction:column;max-height:22vh;transition:max-height .22s ease}
.panel.collapsed{max-height:40px}
.panel-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;height:40px;flex:0 0 40px}
.panel-title{font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:6px;font-family:var(--font);text-transform:uppercase}
.panel-count{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.panel-chev{font-size:.7rem;color:var(--muted);transition:transform .2s}
.panel.collapsed .panel-chev{transform:rotate(-90deg)}
.events{overflow-y:auto;flex:1;min-height:0;padding:4px 8px 8px}
.event{padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--event-border);border-left:3px solid var(--accent);cursor:pointer;background:rgba(0,0,0,.2)}
.event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.event-type{font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-icon{font-size:13px;flex-shrink:0}
.event-time{font-size:10px;color:var(--muted);flex-shrink:0;font-weight:700;font-family:var(--font)}
.event-loc{margin-top:3px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-target{margin-top:3px;font-size:11px;color:#fbbf24;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:1px 5px;border-radius:4px;background:#132630;color:#8faab8;font-size:8px;font-weight:700;line-height:1.4}
.tag.prio{background:rgba(251,191,36,.25);color:#fbbf24}
.tag.speed{background:rgba(59,130,246,.3);color:#93c5fd}
.tag.target{background:rgba(249,115,22,.3);color:#fdba74}
.tag.eta-urgent{background:rgba(220,38,38,.5);color:#fecaca;font-weight:800}
.panel-empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:10px}
.hud-bottom{position:absolute;bottom:calc(14px + var(--safe-bottom));left:0;right:0;z-index:1000;padding:0 6px;pointer-events:none}
.hud-bottom>*{pointer-events:auto}
.btn-row{display:flex;gap:4px;overflow-x:auto;padding:4px 6px;background:var(--panel);border:1px solid var(--border);border-radius:999px;width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.btn-row::-webkit-scrollbar{display:none}
.btn-row button{border-radius:999px;min-width:36px;height:36px;flex:1;border-color:transparent;background:transparent}
button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text);padding:0;border-radius:var(--radius);font-size:.95rem;cursor:pointer;font-weight:700;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;touch-action:manipulation}
button.danger{color:#fca5a5}
button.on{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
button.siren-btn{color:var(--danger)}
button.siren-btn.active{background:var(--danger)!important;color:#fff!important;animation:sirenFlash .35s ease-in-out infinite;border-color:var(--danger)}
@keyframes sirenFlash{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.8)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
.dev-signature{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;font-weight:700;pointer-events:none;z-index:1100;font-family:var(--font);padding:1px 0 calc(1px + var(--safe-bottom));color:#3b82f6}
.leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--text);border-radius:var(--radius);border:1px solid var(--border)}
.leaflet-popup-content{margin:9px 11px;font-size:.75rem;line-height:1.4;max-width:300px}
.leaflet-popup-tip{background:rgba(7,16,24,.97)}
.leaflet-popup-close-button{color:#94a3b8!important;font-size:18px!important}
.popup-title{font-weight:700;font-size:.82rem;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.popup-meta{color:#94a3b8;font-size:.68rem}
.popup-channels{margin-top:6px;padding-top:5px;border-top:1px solid rgba(148,163,184,.18);font-size:.66rem}
.popup-channels .ch{display:inline-block;background:rgba(148,163,184,.2);color:#cbd5e1;padding:1px 6px;border-radius:8px;margin:2px 2px 2px 0}
.popup-channels .ch.prio{background:rgba(251,191,36,.25);color:#fbbf24}
.popup-remove-btn{margin-top:8px;width:100%;height:30px;font-size:.75rem;background:rgba(220,38,38,.25);border:1px solid rgba(248,113,113,.5);color:#fca5a5;border-radius:6px;cursor:pointer;font-weight:800}
.popup-toggle-btn{margin-top:6px;width:100%;height:30px;font-size:.75rem;background:rgba(34,211,238,.2);border:1px solid rgba(34,211,238,.5);color:#67e8f9;border-radius:6px;cursor:pointer;font-weight:800}
.popup-speed{background:rgba(234,88,12,.3);color:#fdba74;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.72rem;display:inline-block;margin-top:4px}
.popup-eta{background:rgba(220,38,38,.25);color:#fca5a5;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px}
.popup-eta.urgent{background:rgba(220,38,38,.55);color:#fff;font-weight:800}
.popup-target{background:linear-gradient(90deg,rgba(249,115,22,.35),rgba(220,38,38,.35));color:#fdba74;padding:4px 8px;border-radius:5px;font-weight:800;font-size:.74rem;display:block;margin-top:4px;border:1px solid rgba(251,146,60,.6);text-align:center}
.popup-target.kyiv{background:linear-gradient(90deg,rgba(220,38,38,.55),rgba(249,115,22,.55));color:#fff;animation:targetPulse 1.2s ease-in-out infinite}
.popup-dist{background:rgba(59,130,246,.25);color:#93c5fd;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px}
.popup-exactname{background:rgba(220,38,38,.3);color:#fecaca;padding:3px 6px;border-radius:5px;font-weight:800;font-size:.72rem;display:inline-block;margin-top:4px}
.popup-trail{margin-top:6px;padding:6px 8px;border-radius:5px;background:rgba(148,163,184,.12);border:1px dashed rgba(148,163,184,.5);font-size:.68rem;line-height:1.45;color:#cbd5e1;max-height:150px;overflow-y:auto}
.popup-trail .pt-point{display:flex;gap:5px;margin:1px 0}
.popup-trail .pt-num{flex-shrink:0;color:#94a3b8;min-width:14px}
.popup-trail .pt-place{flex:1}
.popup-trail .pt-time{color:#94a3b8;font-size:.6rem}
.threat-wrap{position:relative;width:28px;height:28px}
.threat-rotate{position:absolute;inset:0;transform-origin:center center}
.threat-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 5px rgba(0,0,0,.5));transform-origin:center center;position:relative;animation:pulse 1.8s ease-in-out infinite}
.threat-icon svg{width:24px;height:24px;display:block}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,0,0,.5));opacity:1}50%{filter:drop-shadow(0 0 8px rgba(251,191,36,.55));opacity:.92}}
.threat-icon.falling{animation:fallingBlink .55s ease-in-out infinite}
@keyframes fallingBlink{0%,100%{opacity:1}50%{opacity:.35}}
.threat-icon.stale{opacity:.55}
.threat-icon.threat-pulse{animation:threatPulse 1s ease-in-out infinite}
@keyframes threatPulse{0%,100%{filter:drop-shadow(0 0 3px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.55}}
.threat-icon.uav-siren{animation:uavSirenPulse .7s ease-in-out infinite}
@keyframes uavSirenPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.threat-icon.ballistic-alarm{animation:ballisticAlarmPulse .5s ease-in-out infinite}
@keyframes ballisticAlarmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2);opacity:.75}}
.threat-icon.priority-star::after{content:"⭐";position:absolute;top:-10px;left:-6px;font-size:11px}
.threat-icon.arrived-pulse{animation:arrivedPulse .7s ease-in-out infinite}
@keyframes arrivedPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.55}}
.threat-icon.on-kyiv-pulse{animation:onKyivPulse 1.2s ease-in-out infinite}
@keyframes onKyivPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(220,38,38,.9))}50%{filter:drop-shadow(0 0 14px rgba(220,38,38,1))}}
.count-badge{position:absolute;right:-6px;top:-6px;height:14px;min-width:14px;padding:0 4px;border-radius:7px;background:#ea580c;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:5}
.confirm-badge{position:absolute;left:-6px;top:-6px;height:13px;min-width:13px;padding:0 3px;border-radius:7px;background:#16a34a;color:#fff;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:5}
.confirm-badge::before{content:"✓"}
.confirm-badge.medium{background:#ca8a04}
.confirm-badge.low{background:#dc2626}
.confirm-badge.pending{background:#0ea5e9}
.history-panel{position:absolute;bottom:calc(var(--safe-bottom) + 56px);right:10px;width:min(300px,88vw);max-height:42vh;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);z-index:4500;display:none;flex-direction:column;overflow:hidden}
.history-panel.show{display:flex}
.history-header{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(148,163,184,.2);font-size:12px;font-weight:800}
.history-list{overflow-y:auto;flex:1;padding:4px 0}
.history-item{padding:7px 10px;border-bottom:1px solid rgba(148,163,184,.1);font-size:11px;cursor:pointer}
.history-item .hi-time{color:var(--muted);font-size:10px}
.history-item .hi-loc{color:#94a3b8;margin-top:1px}
.impact-marker-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px;filter:drop-shadow(0 0 5px rgba(255,120,0,.95));animation:impactPop .9s ease-in-out infinite}
@keyframes impactPop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.impact-marker{width:36px;height:36px;display:flex;align-items:center;justify-content:center;line-height:1}
.impact-marker.hit{animation:impactHit 1s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(220,38,38,1))}
.impact-marker.shot{animation:impactShot 1.2s ease-in-out infinite}
.impact-marker.fire{animation:impactFire 1.1s ease-in-out infinite}
.impact-marker.unknown{animation:impactUnknown 1.4s ease-in-out infinite}
@keyframes impactHit{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes impactShot{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes impactFire{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes impactUnknown{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.impact-marker svg{width:32px;height:32px;display:block}
.target-marker-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:22px;filter:drop-shadow(0 0 8px rgba(251,146,60,1)) drop-shadow(0 0 4px rgba(220,38,38,.9));animation:targetIconPulse 1.4s ease-in-out infinite}
@keyframes targetIconPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.85}}
.target-marker-label{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);background:rgba(251,146,60,.95);color:#0f172a;font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;white-space:nowrap;border:1px solid #fff;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.arrival-unknown{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fbbf24;animation:unknownPulse 1.2s ease-in-out infinite}
@keyframes unknownPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.err-banner{position:absolute;top:calc(36px + var(--safe-top));left:0;right:0;z-index:5000;background:#b91c1c;color:#fff;padding:8px 10px;font-size:.72rem;display:none}
.err-banner.show{display:block}
.err-banner .err-close{float:right;background:0;border:0;color:#fff;font-size:1.1rem;cursor:pointer;padding:0 4px}
.toast{position:absolute;left:50%;top:calc(48px + var(--safe-top) + 12px);transform:translateX(-50%);z-index:2000;background:var(--panel-solid);color:var(--text);padding:9px 14px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:85vw;text-align:center}
.toast.show{opacity:1}
.leaflet-control-attribution{font-size:8px!important;background:var(--panel)!important;color:var(--muted)!important;padding:2px 5px!important}
.leaflet-control-zoom{border:none!important;margin-right:10px!important;margin-bottom:10px!important}
.leaflet-control-zoom a{background:var(--btn-bg)!important;color:var(--text)!important;border:1px solid var(--border)!important;width:34px!important;height:34px!important;line-height:34px!important;font-size:16px!important;border-radius:10px!important}
.settlement-marker{background:transparent;border:0}
.settlement-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;border:1.5px solid #fff}
.settlement-dot.city{background:#16a34a;width:11px;height:11px;border-width:2px}
.settlement-dot.raion{background:#3b82f6;width:9px;height:9px}
.infra-marker{background:transparent;border:0}
.infra-bridge,.infra-energy,.infra-incident{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px}

/* ============================================================
   KYIV OSINT RADAR v15.4
   На базе v15.3 + приоритетные улучшения:
   - Расширенный парсер мест (падежи, районы, области, "повз/на/з")
   - Приоритет ЦЕЛИ над источником
   - Маркер цели на карте

   - Красный алерт при цели на Киев
   - Траектория с маршрутом (по тапу)
   - Красная пульсация при прилёте

"use strict";
const $ = id => document.getElementById(id);
const esc = s => (s == null ? "" : String(s)).replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm = s => (s || "").toLowerCase().replace(/[’`´']/g,"'").replace(/[^\p{L}\p{N}\s'-]/gu," ").replace(/\s+/g," ").trim();

function haversineKm(a,b,c,d){const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(c-a),dLon=toR(d-b);const x=Math.sin(dLat/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearingBetween(lat1,lon1,lat2,lon2){const φ1=lat1*Math.PI/180,φ2=lat2*Math.PI/180,Δλ=(lon2-lon1)*Math.PI/180;const y=Math.sin(Δλ)*Math.cos(φ2);const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);return(Math.atan2(y,x)*180/Math.PI+360)%360;}
function destPoint(lat,lon,brg,distKm){const R=6371,br=brg*Math.PI/180,lat1=lat*Math.PI/180,lon1=lon*Math.PI/180;const lat2=Math.asin(Math.sin(lat1)*Math.cos(distKm/R)+Math.cos(lat1)*Math.sin(distKm/R)*Math.cos(br));const lon2=lon1+Math.atan2(Math.sin(br)*Math.sin(distKm/R)*Math.cos(lat1),Math.cos(distKm/R)-Math.sin(lat1)*Math.sin(lat2));return[lat2*180/Math.PI,lon2*180/Math.PI];}
function levenshtein(a,b){a=(a||"").toLowerCase();b=(b||"").toLowerCase();const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c);}return dp[m][n];}
function showToast(msg,ms=1800){const t=$("toast");if(!t)return;t.textContent=msg;t.classList.add("show");clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),ms);}
function formatEta(m){if(m==null)return"—";if(m<0.5)return"<1 хв";if(m<60)return`~${Math.round(m)} хв`;return`~${Math.floor(m/60)} год ${Math.round(m%60)} хв`;}

/* ========== УКРАИНСКАЯ МОРФОЛОГИЯ ========== */
/**
 * Отсекает падежные окончания украинских слов.
 * "Троєщину" -> "троєщин", "Вишгорода" -> "вишгород", "Броварах" -> "бровар"
 */
function ukStem(word){
  if(!word) return "";
  let s = word.toLowerCase().replace(/[’`´']/g, "'");
  // Отсекаем распространённые окончания
  s = s.replace(/(ами|ями|ові|еві|ової|овою|евої|евую|ому|ему|ої|ею|ою|ах|ях|ам|ям|ів|ев|ий|ій|им|ім|их|іх|ов|ев|у|ю|а|я|и|і|о|е|ь|й)$/i, "");
  return s.length >= 3 ? s : word.toLowerCase();
}

/* ========== BALLISTIC CLASSES ========== */
const BALLISTIC_CLASSES = {
  iskander:{speed:2100,label:"Іскандер-М"}, kinzhal:{speed:12000,label:"Кинжал"},

};
function detectBallisticClass(text){
  if(!text) return BALLISTIC_CLASSES.default;
  if(/кинджал|кінжал|kinzhal|х-47/i.test(text)) return BALLISTIC_CLASSES.kinzhal;
  if(/циркон|zircon|3м22/i.test(text)) return BALLISTIC_CLASSES.zircon;
  if(/кн-?23|kn-?23/i.test(text)) return BALLISTIC_CLASSES.kn23;
  if(/іскандер|искандер/i.test(text)) return BALLISTIC_CLASSES.iskander;
  if(/с-?300/i.test(text)) return BALLISTIC_CLASSES.s300;
  return BALLISTIC_CLASSES.default;
}

/* ========== SCOPE ========== */
const Scope = (()=>{
  const KEY="kyiv_scope_mode_v1"; let mode="kyiv";
  try{const v=localStorage.getItem(KEY);if(v==="kyiv"||v==="ukraine")mode=v;}catch(e){}
  return{get:()=>mode,set:m=>{mode=(m==="ukraine")?"ukraine":"kyiv";try{localStorage.setItem(KEY,mode);}catch(e){}},isUkraine:()=>mode==="ukraine"};
})();
function inZone(lat,lon){
  if(lat==null||lon==null)return false;
  if(Scope.isUkraine()){const[[s,w],[n,e]]=CONFIG.UKRAINE_BOUNDS;return lat>=s&&lat<=n&&lon>=w&&lon<=e;}
  return haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],lat,lon)<=CONFIG.ZONE_RADIUS_KM;
}

const CHANNEL_WEIGHTS={"deraketaua":2.0,"war_raketaua":1.8,"monitorwarr":1.8,"ua_rockets":1.5,"kpszsu":1.5,"chyste_nebo":1.4,"radar_raketaa":1.3,"mon1tor_ua":1.5,"monitor_ua":1.5};
const PRIORITY_WEIGHT=3.0;
function isPriorityChannel(ch){const k=(ch||"").replace(/^@/,"").toLowerCase().trim();if(PRIORITY_CHANNELS.has(k))return true;for(const p of PRIORITY_CHANNELS)if(k.includes(p))return true;return false;}
function channelWeight(name){if(isPriorityChannel(name))return PRIORITY_WEIGHT;const k=(name||"").replace(/^@/,"").toLowerCase().trim();if(CHANNEL_WEIGHTS[k]!=null)return CHANNEL_WEIGHTS[k];for(const[key,w]of Object.entries(CHANNEL_WEIGHTS))if(k.includes(key))return w;return 1.0;}
function channelClass(name){if(isPriorityChannel(name))return"prio";const w=channelWeight(name);if(w>=1.5)return"trusted";if(w>=1.0)return"";return"suspicious";}
function totalWeightOf(set){let w=0;for(const ch of set)w+=channelWeight(ch);return w;}
function hasPrioritySource(channels){for(const ch of channels)if(isPriorityChannel(ch))return true;return false;}

/* ========== FINDING PLACES ========== */
/**
 * Ищет место в тексте. Приоритет:
 * 1. Паттерны цели ("на X", "курс на X", "у напрямку X", "повз X")
 * 2. Населённые пункты (с падежами)
 * 3. Районы
 * 4. Области
 * 5. Микрорайоны Киева
 * 6. Точки интереса (ТЕЦ и т.д.)
 */
function findPlaceInText(text){
  if(!text)return null;
  const low=text.toLowerCase().replace(/[’`´]/g,"'");
  
  // === 1. Паттерны ЦЕЛИ ===
  const targetPatterns=[
    /(?:курс(?:ом)?\s+на|в\s+напрямку|у\s+бік|у\s+напрямку|на\s+підльоті\s+до|летить\s+на|рухається\s+на|прямує\s+на)\s+([А-ЯІЇЄҐа-яіїєґ'’\-]+(?:\s+[А-ЯІЇЄҐа-яіїєґ][а-яіїєґ'’\-]+){0,3})/i,
    /повз\s+([А-ЯІЇЄҐа-яіїєґ'’\-]+(?:\s+[А-ЯІЇЄҐа-яіїєґ][а-яіїєґ'’\-]+){0,2})/i,
    /на\s+([А-ЯІЇЄҐ][а-яіїєґ'’\-]+(?:\s+[А-ЯІЇЄҐа-яіїєґ][а-яіїєґ'’\-]+){0,2})\s*(?:район|обл|!|\.|,|$)/i,
    /🛵\s*([А-ЯІЇЄҐа-яіїєґ'’\-]+)/i
  ];
  for(const re of targetPatterns){
    const m=re.exec(text);
    if(m){
      const p=findAnyPlace(m[1].trim());
      if(p)return{...p,index:m.index,length:m[0].length,isTarget:true};
    }
  }
  
  // === 2. Населённые пункты (точное совпадение) ===
  let best=null;
  for(const s of KYIV_OBLAST_SETTLEMENTS){
    const n=norm(s[0]);
    if(n.length<3)continue;
    const idx=low.indexOf(n);
    if(idx<0)continue;
    const typeScore=s[4]==="c"?2:1;
    const score=n.length*10+typeScore;
    if(!best||score>best.score)best={key:"settlement:"+n,name:s[0],lat:s[1],lon:s[2],index:idx,length:n.length,score};
  }
  if(best)return best;
  
  // === 3. Населённые пункты с падежами ===
  for(const s of SETTLEMENT_INDEX.cities){
    const stem=s.stem;
    if(stem.length<4)continue;
    // Ищем основу (без окончания)
    const base = s.norm.slice(0, -2);
    if(base.length<3)continue;
    const idx=low.indexOf(base);
    if(idx<0)continue;
    // Проверяем что следующее слово начинается с окончания падежа
    const next=low.slice(idx+base.length, idx+base.length+4);
    if(/^(а|у|і|и|ою|ою|ах|ях|ів|ев|ий|ій|е|ь|я|ю|ом|ем|ові|еві)/i.test(next)||next.length===0||!/[а-яіїєґa-z]/.test(next[0])){
      return{key:"settlement:"+stem,name:s.name,lat:s.lat,lon:s.lon,index:idx,length:base.length+2,_fromStem:true};
    }
  }
  
  // === 4. Районы ===
  for(const r of KYIV_RAIONS){
    for(const alias of r.aliases){
      const idx=low.indexOf(alias.toLowerCase());
      if(idx>=0)return{key:"raion:"+r.name,name:r.name+" район",lat:r.lat,lon:r.lon,index:idx,length:alias.length};
    }
    // Ищем основу
    const base=ukStem(r.name);
    const idx=low.indexOf(base);
    if(idx>=0)return{key:"raion:"+r.name,name:r.name+" район",lat:r.lat,lon:r.lon,index:idx,length:base.length+2};
  }
  
  // === 5. Области ===
  for(const o of OBLASTS){
    for(const alias of o.aliases){
      const idx=low.indexOf(alias.toLowerCase());
      if(idx>=0)return{key:"oblast:"+o.name,name:o.name,lat:o.lat,lon:o.lon,index:idx,length:alias.length,isOblast:true};
    }
  }
  
  // === 6. Микрорайоны Киева ===
  for(const a of KYIV_AREAS){
    for(const alias of a.aliases){
      const idx=low.indexOf(alias.toLowerCase());
      if(idx>=0)return{key:"area:"+a.id,name:a.name,lat:a.lat,lon:a.lon,index:idx,length:alias.length};
    }
    const stem=ukStem(a.name);
    const idx=low.indexOf(stem);
    if(idx>=0)return{key:"area:"+a.id,name:a.name,lat:a.lat,lon:a.lon,index:idx,length:stem.length+2};
  }
  
  // === 7. Точки интереса (ТЕЦ, ГЭС и т.д.) ===
  for(const key of Object.keys(EXTRA_PLACES)){
    let idx=-1;
    try{idx=low.search(new RegExp(key,"i"));}catch(e){continue;}
    if(idx<0)continue;
    const arr=EXTRA_PLACES[key];
    return{key:"extra:"+key,name:arr[2],lat:arr[0],lon:arr[1],index:idx,length:key.length,...(arr[3]||{})};
  }
  
  return null;
}
function findAnyPlace(name){
  if(!name)return null;
  // Прямое совпадение
  let p=findPlaceInText(name);
  if(p)return p;
  // Падеж
  const stem=ukStem(name);
  p=findPlaceInText(stem);
  return p;
}
function findPlaceFuzzy(text){return findPlaceInText(text);}

  uav:{color:"#facc15",label:"БПЛА"},recon:{color:"#facc15",label:"Розв"},
  geran2:{color:"#dc2626",label:"Герань-2",isGeran:true},geran3:{color:"#dc2626",label:"Герань-3",isGeran:true},

  missile:{color:"#dc2626",label:"КР"},ballistic:{color:"#dc2626",label:"Бал"},
  banderol:{color:"#dc2626",label:"S8000"},kab:{color:"#dc2626",label:"КАБ"},

  unknown:{color:"#475569",label:"?"}
};
const getMeta=ty=>TYPE_META[ty]||TYPE_META.unknown;
function iconColorFor(ty){const m=getMeta(ty);if(ty==="jet_drone"||ty==="geran5")return"#dc2626";if(m.color==="#dc2626")return"#dc2626";return"#facc15";}
function uavSvgArrow(c){c=c||"#facc15";return`<svg viewBox="0 0 40 40"><path d="M20 3 L32 24 L25 25 L25 34 L20 31 L15 34 L15 25 L8 24 Z" fill="${c}" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/></svg>`;}
function rocketSvg(c){return`<svg viewBox="0 0 24 40"><path d="M12 1 C14 1 16 6 16 12 L16 26 L19 32 L16 30 L16 34 L12 38 L8 34 L8 30 L5 32 L8 26 L8 12 C8 6 10 1 12 1 Z" fill="${c||"#dc2626"}" stroke="#1a1a1a" stroke-width="1.1"/></svg>`;}
function svgForType(ty){
  const col=iconColorFor(ty);
  if(["missile","ballistic","banderol","zircon"].includes(ty))return rocketSvg(col);
  if(["geran2","geran3","geran4","geran5","jet_drone"].includes(ty))return uavSvgArrow("#dc2626");
  return uavSvgArrow(col);
}
const SIZE_BASE=28;
function makeIcon(cls,heading,confirmN,stale,inSiren,onKyiv){
  const svg=svgForType(cls.type);
  const rot=heading!=null?heading:0;
  const classes=["threat-icon"];
  if(cls._arrived)classes.push("arrived-pulse");
  else{
    if(cls._falling)classes.push("falling");
    if(stale)classes.push("stale");
    if(inSiren)classes.push("uav-siren");
    if(onKyiv)classes.push("on-kyiv-pulse");
  }
  let confirmHtml="";
  if(!cls._arrived&&confirmN>=2)confirmHtml=`<div class="confirm-badge">${confirmN}</div>`;
  return L.divIcon({
    className:"",
    html:`<div class="threat-wrap"><div class="threat-rotate" style="transform:rotate(${rot}deg)"><div class="${classes.join(" ")}">${svg}</div></div>${confirmHtml}</div>`,
    iconSize:[SIZE_BASE,SIZE_BASE],iconAnchor:[SIZE_BASE/2,SIZE_BASE/2],popupAnchor:[0,-SIZE_BASE/2]
  });
}
function targetIcon(name){
  const lbl=name?`<div class="target-marker-label">🎯 ${esc(name.slice(0,20))}</div>`:"";
  return L.divIcon({className:"",html:`<div style="position:relative"><div class="target-marker-icon">🎯</div>${lbl}</div>`,iconSize:[32,32],iconAnchor:[16,16]});
}
function impactSmallIcon(){return L.divIcon({className:"",html:`<div class="impact-marker-icon">💥</div>`,iconSize:[20,20],iconAnchor:[10,10]});}
function impactBigIcon(kind){
  let inner;
  if(kind==="shot")inner=`<div class="impact-marker shot">✓</div>`;
  else if(kind==="fire")inner=`<div class="impact-marker fire">🔥</div>`;
  else if(kind==="unknown")inner=`<div class="impact-marker unknown"><span class="arrival-unknown">❓</span></div>`;
  else inner=`<div class="impact-marker hit">💥</div>`;
  return L.divIcon({className:"",html:inner,iconSize:[36,36],iconAnchor:[18,18]});
}

/* ========== CLASSIFIER ========== */
const CLASSIFIER=(()=>{
  const HARD=[
    {re:/ту-?\s*95|ту-?\s*160|ту-?\s*22|стратег/i,type:"strategic_aviation",label:"Стратег"},
    {re:/циркон|zircon|3м22/i,type:"zircon",label:"Циркон",isMissile:true},
    {re:/реактивн[а-яіїєґ]*\s*(шахед|геран|бпла|дрон)|реактивн[а-яіїєґ]*\s+шахед/i,type:"jet_drone",label:"Реакт. БПЛА",isJetDrone:true},
    {re:/ум[пб]б/i,type:"umpb",label:"УМПБ"},
    {re:/бандерол|s\s*[-]?\s*8000/i,type:"banderol",label:"S8000"},
    {re:/герань\s*-?\s*5/i,type:"geran5",label:"Герань-5",isGeran:true},
    {re:/герань\s*-?\s*4/i,type:"geran4",label:"Герань-4",isGeran:true},
    {re:/герань\s*-?\s*3/i,type:"geran3",label:"Герань-3",isGeran:true},
    {re:/герань\s*-?\s*2/i,type:"geran2",label:"Герань-2",isGeran:true},
    {re:/балістик|баллистик|кинжал|кінжал|іскандер|искандер|кн-?23/i,type:"ballistic",label:"Бал"},
    {re:/каб\b|kab\b/i,type:"kab",label:"КАБ"},
    {re:/крилат[аиі]?\s+ракет|х-?\s*101|х-?\s*555|калібр|калибр/i,type:"missile",label:"КР"},
    {re:/миг-?31|міг-?31/i,type:"mig31k",label:"МиГ-31К"}
  ];
  const SOFT=[
    {re:/fpv|фпв/i,type:"fpv",label:"FPV"},
    {re:/розвідник|разведчик/i,type:"recon",label:"Розв"},
    {re:/шахед|shahed|герань|geran|бпла|дрон|безпілотник|беспилотник/i,type:"uav",label:"БПЛА"}
  ];
  return function(text){
    text=text||"";
    for(const r of HARD)if(r.re.test(text))return{...r,hard:true};
    for(const r of SOFT)if(r.re.test(text))return{...r,hard:false};
    return null;
  };
})();
function detectExactName(text){
  if(!text)return null;
  const tt=text.toLowerCase();
  let m=tt.match(/герань\s*-?\s*([2-5])/);if(m)return`Герань-${m[1]}`;
  m=tt.match(/шахед\s*-?\s*(\d{2,3})/);if(m)return`Шахед-${m[1]}`;
  if(/реактивн/.test(tt))return"Реактивний БПЛА";
  if(/розвідник/.test(tt))return"Розвідник";
  if(/fpv|фпв/.test(tt))return"FPV";
  m=tt.match(/іскандер\s*-?\s*([мк])/i);if(m)return`Іскандер-${m[1].toUpperCase()}`;
  if(/кинжал|кінжал/.test(tt))return"Кинжал";
  if(/циркон|zircon/.test(tt))return"Циркон";
  return null;
}
function resolveSpeedKmh(type,txt){
  if(type==="ballistic"||(txt&&/балістик|баллистик|кинжал|кінжал|іскандер|искандер/i.test(txt)))return detectBallisticClass(txt||"").speed;
  const F={uav:180,recon:120,fpv:80,geran2:180,geran3:190,geran4:200,geran5:220,jet_drone:800,missile:900,ballistic:2100,banderol:700,kab:400,umpb:500,mig31k:900,strategic_aviation:800,zircon:2500};
  return F[type]||150;
}
function etaToKyivMin(lat,lon,type,spd){
  if(lat==null||lon==null)return null;
  const s=spd||resolveSpeedKmh(type,"");
  return haversineKm(lat,lon,CONFIG.KYIV[0],CONFIG.KYIV[1])/s*60;
}
function isKyivOrOblast(name){return/київ|киев/i.test(name||"");}

/* ========== IMPACT REPORTS ========== */
const IMPACT_REPORTS_DB=[
  {kind:"hit",icon:"💥",label:"Вибух / приліт",color:"#dc2626",re:/прил[іi]т|прилет|влуч[аи]нн|влучив|удар\s+по|бавовн|пошкоджен|зруйнован|здетонував/i},
  {kind:"shot",icon:"🛡️",label:"Збиття / перехоплення",color:"#16a34a",re:/збит[тоя]|сбит[оы]|перехоплен|ліквідован|знищен/i},
  {kind:"fire",icon:"🔥",label:"Пожежа",color:"#f97316",re:/пожеж|пожар|горит/i},
  {kind:"down",icon:"🛬",label:"Падіння",color:"#fb923c",re:/падає|падають|падінн|впав|упал|уламк|обломк|осколк|фрагмент/i}
];
const IMPACT_RE=new RegExp(["прил[іi]т","прилет","влуч[аи]нн","удар\\s+по","бавовн","уламк","обломк","збит","сбит","пожеж","пожар","зруйнован","пошкоджен"].join("|"),"i");
function detectImpactReports(text){
  if(!text)return[];
  const found=[];
  for(const r of IMPACT_REPORTS_DB)if(r.re.test(text))found.push(r);
  return found;
}
function extractImpact(text){
  if(!text)return null;
  const m=IMPACT_RE.exec(text);
  if(!m)return null;
  const place=findPlaceInText(text);
  if(!place)return null;
  if(!inZone(place.lat,place.lon))return null;
  return{target:place,impactPos:m.index};
}

const threatLayer=L.layerGroup(),targetLayer=L.layerGroup(),impactLayer=L.layerGroup(),settlementsLayer=L.layerGroup(),infraLayer=L.layerGroup();
let ringsLayer=null;

/* ========== STATE ========== */
const State=(()=>{
  const trails=new Map(),targets=new Map(),impactMarkers=new Map(),activeWarnings=new Map(),dismissedKeys=new Map(),firedSoundKeys=new Map(),approachingNotified=new Map();
  function isDismissed(key){if(!key)return false;const ts=dismissedKeys.get(key);if(!ts)return false;if(Date.now()-ts>30*60*1000){dismissedKeys.delete(key);return false;}return true;}
  function dismiss(key){if(!key)return;dismissedKeys.set(key,Date.now());}
  function closeTrail(key){
    const chain=trails.get(key);if(!chain)return;
    if(chain.markerRef?.marker&&threatLayer)try{threatLayer.removeLayer(chain.markerRef.marker);}catch(e){}
    if(chain.polyline&&map)try{map.removeLayer(chain.polyline);}catch(e){}
    if(chain.markerRef?.trailPoints){for(const m of chain.markerRef.trailPoints)try{map.removeLayer(m);}catch(e){}}
    if(chain._simTimer)clearInterval(chain._simTimer);
    trails.delete(key);
  }
  function closeTarget(key){
    const t=targets.get(key);if(!t)return;
    if(t.marker&&targetLayer)try{targetLayer.removeLayer(t.marker);}catch(e){}
    targets.delete(key);
  }
  function clearAll(){
    for(const key of[...trails.keys()])closeTrail(key);
    for(const key of[...targets.keys()])closeTarget(key);
    impactMarkers.forEach(o=>{if(o.marker&&impactLayer)try{impactLayer.removeLayer(o.marker);}catch(e){}});
    impactMarkers.clear();
    activeWarnings.clear();
    Alerts.hideTopAlert();
    Mass.hideBanner();
    Feed.schedule();
  }
  return{trails,targets,impactMarkers,activeWarnings,dismissedKeys,firedSoundKeys,approachingNotified,isDismissed,dismiss,closeTrail,closeTarget,clearAll};
})();

/* ========== AUDIO ========== */
const Audio=(()=>{
  let ctx=null,lastSoundAt=0,sirenBtnTimer=null,lastBallisticAlarmAt=0;
  function init(){if(ctx)return ctx;try{ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){ctx=null;}return ctx;}
  function unlock(){const c=init();if(c&&c.state==="suspended")c.resume().catch(()=>{});}
  function playBell(){
    if(!ctx)return;const now=ctx.currentTime;
    [{f:880,g:.30,d:1.1},{f:1760,g:.14,d:.7}].forEach(p=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.setValueAtTime(p.f,now);
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(p.g,now+.012);
      g.gain.exponentialRampToValueAtTime(.0001,now+p.d);
      o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+p.d+.05);
    });
  }
  function playAlert(force){if(!CONFIG.SOUND_ENABLED)return;const now=Date.now();if(!force&&now-lastSoundAt<CONFIG.SOUND_COOLDOWN_MS)return;lastSoundAt=now;const c=init();if(!c)return;try{if(c.state==="suspended")c.resume();playBell();}catch(e){}}
  function playSirenOnce(dur=3000){
    const c=init();if(!c)return;if(c.state==="suspended")c.resume();
    const n=c.currentTime,d=dur/1000;
    const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
    o.type="sawtooth";o.frequency.setValueAtTime(440,n);o.frequency.linearRampToValueAtTime(880,n+d*.25);o.frequency.linearRampToValueAtTime(440,n+d);
    f.type="bandpass";f.frequency.value=800;f.Q.value=3;
    g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(.35,n+.1);g.gain.setValueAtTime(.35,n+d-.15);g.gain.linearRampToValueAtTime(.0001,n+d);
    o.connect(f);f.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05);
  }
  function flashSirenBtn(d){const b=$("sirenBtn");if(!b)return;b.classList.add("active");if(sirenBtnTimer)clearTimeout(sirenBtnTimer);sirenBtnTimer=setTimeout(()=>b.classList.remove("active"),d||3000);}
  function triggerSirenSequence(dur=3000,times=1){const n=Math.max(1,times||1);flashSirenBtn(dur*n+(n-1)*250);for(let i=0;i<n;i++)setTimeout(()=>playSirenOnce(dur),i*(dur+250));}
  function triggerBallisticAlarm(){
    const now=Date.now();if(now-lastBallisticAlarmAt<CONFIG.BALLISTIC_SIREN_COOLDOWN_MS)return false;lastBallisticAlarmAt=now;
    triggerSirenSequence(3000,3);
    Alerts.showTopAlert({kind:"ballistic",icon:"🚨",title:"УВАГА! ЗАГРОЗА БАЛІСТИКИ",place:"Пуск / залп балістики або Циркон",meta:"НЕГАЙНО ПРЯМУЙТЕ ДО УКРИТТЯ!"});
    return true;
  }
  return{init,unlock,playAlert,playSirenOnce,triggerSirenSequence,triggerBallisticAlarm};
})();

/* ========== ALERTS ========== */
const Alerts=(()=>{
  let timer=null,lastKind=null;
  function isSummary(text){return/протягом\s+(?:минулої|останньої)\s+доби|за\s+(?:минулу|останню)\s+добу|зведення\s+за\s+добу/i.test(text||"");}
  function showTopAlert({kind,icon,title,place,meta,rawText}){
    const el=$("topAlert");if(!el)return;
    if(lastKind==="ballistic"&&kind!=="ballistic"&&timer)return;
    if(isSummary(rawText)||isSummary(meta))return;
    const key=(kind||"")+"|"+(place||"")+"|"+(rawText||meta||"").slice(0,60);
    const prev=el.dataset.lastKey;const now=Date.now();const prevT=+el.dataset.lastT||0;
    if(prev===key&&now-prevT<15*60*1000)return;
    el.dataset.lastKey=key;el.dataset.lastT=now;
    lastKind=kind;
    el.className="top-alert show "+kind;
    const iE=$("topAlertIcon"),tE=$("topAlertTitle"),pE=$("topAlertPlace"),mE=$("topAlertMeta");
    if(iE)iE.textContent=icon||"🚨";
    if(tE)tE.textContent=title||"—";
    if(place){if(pE){pE.textContent=place;pE.style.display="block";}}else if(pE)pE.style.display="none";
    if(meta){if(mE){mE.textContent=meta;mE.style.display="block";}}else if(mE)mE.style.display="none";
    if(timer)clearTimeout(timer);
    const ttl=kind==="ballistic"?CONFIG.TOP_ALERT_BALLISTIC_TTL_MS:CONFIG.TOP_ALERT_TTL_MS;
    timer=setTimeout(()=>hideTopAlert(),ttl);
  }
  function hideTopAlert(){const el=$("topAlert");if(el)el.classList.remove("show");lastKind=null;if(timer){clearTimeout(timer);timer=null;}}
  function showTargetAlert(target,cls){
    const isKyivTarget=isKyivOrOblast(target.name)||haversineKm(target.lat,target.lon,CONFIG.KYIV[0],CONFIG.KYIV[1])<15;
    if(!isKyivTarget)return;
    const meta=cls?`${cls.label} · ${Math.round(haversineKm(target.lat,target.lon,CONFIG.KYIV[0],CONFIG.KYIV[1]))} км від Києва`:"";
    showTopAlert({kind:"target",icon:"🎯",title:"ЦІЛЬ — КИЇВ",place:target.name,meta,rawText:"target:"+target.name});
    Audio.playAlert(true);
  }
  return{showTopAlert,hideTopAlert,showTargetAlert,isSummary};
})();

/* ========== MASS ========== */
const Mass=(()=>{
  const TRIGGER_RE=/пуск[и]?\s+реактивних|залп[и]?\s+реактивних|масован[а-яіїєґ]*\s+пуск|підвіз\s+балістичних|іскандер[-–\s]?м|кн[-–\s]?23|доставка\s+реактивних\s+бпла|доставка\s+шахед/i;
  const AIRFIELDS=[
    {key:"orel",re:/орел[-–\s]?південн/i,name:"Орел-Южный",lat:52.75,lon:36.20,region:"Орловська"},
    {key:"bryansk",re:/брянськ|брянск/i,name:"Брянск",lat:53.25,lon:34.37,region:"Брянська"},
    {key:"kursk",re:/курськ|курск/i,name:"Курск",lat:51.73,lon:36.19,region:"Курська"},
    {key:"voronezh",re:/воронеж/i,name:"Воронеж",lat:51.67,lon:39.18,region:"Воронезька"}
  ];
  let bannerTimer=null,active=false;
  function detect(text){
    if(!text||!TRIGGER_RE.test(text))return null;
    const airports=AIRFIELDS.filter(a=>a.re.test(text));
    const lines=[];let title="МАСОВАНА ЗАГРОЗА",icon="🚀";
    if(/пуск|залп|масован/i.test(text)&&/реактивн/i.test(text)){title="🚀 ПУСКИ РЕАКТИВНИХ БПЛА";icon="🚀";}
    if(/підвіз|іскандер|кн[-–\s]?23|балістичних/i.test(text)){title="🚀 ПІДВІЗ БАЛІСТИКИ";icon="🚀";if(/курськ/i.test(text))lines.push("📍 Курська обл. — Іскандер-М");if(/воронеж/i.test(text))lines.push("📍 Воронезька обл. — KN-23");}
    if(/доставка|шахед|аеродром/i.test(text)&&/шахед|реактивн/i.test(text)){title="🛸 ДОСТАВКА ШАХЕДІВ";icon="🛸";for(const a of airports)lines.push(`🛫 ${a.name}`);}
    return{title,icon,lines:lines.length?lines:["Активність зафіксовано"],airports,text:text.slice(0,300)};
  }
  function showBanner(info,ch){
    const el=$("massBanner");if(!el)return;
    const icon=$("massBannerIcon"),title=$("massBannerTitle");
    const l1=$("massBannerLine1"),l2=$("massBannerLine2"),l3=$("massBannerLine3");
    if(icon)icon.textContent=info.icon;
    if(title)title.textContent=info.title;
    const lines=info.lines||[];
    if(l1){l1.innerHTML=lines[0]||"—";l1.style.display="block";}
    if(l2){l2.innerHTML=lines[1]||"";l2.style.display=lines[1]?"block":"none";}
    if(l3){l3.innerHTML=lines[2]||"";l3.style.display=lines[2]?"block":"none";}
    el.classList.add("show");active=true;
    if(bannerTimer)clearTimeout(bannerTimer);
    bannerTimer=setTimeout(()=>hideBanner(),15*60*1000);
    if(ch&&isPriorityChannel(ch))Audio.playAlert(true);
    Feed.schedule();
  }
  function hideBanner(){const el=$("massBanner");if(el)el.classList.remove("show");active=false;if(bannerTimer){clearTimeout(bannerTimer);bannerTimer=null;}}
  function process(text,ch,msgMs){
    if(!text)return;
    if(!isPriorityChannel(ch)&&channelWeight(ch)<1.3)return;
    const info=detect(text);if(!info)return;
    info.channel=ch;info.ts=msgMs;showBanner(info,ch);
  }
  return{detect,showBanner,hideBanner,process,isActive:()=>active,getTitle:()=>($("massBannerTitle")||{}).textContent||"—"};
})();

/* ========== POPUP ========== */
const Popup=(()=>{
  function buildTrail(chain){
    const meta=getMeta(chain.cls.type);
    const label=chain.exactName||(meta?meta.label:chain.cls.label||"");
    const last=chain.points[chain.points.length-1];
    const eta=last?etaToKyivMin(last.lat,last.lon,chain.cls.type,chain.speedKmh):null;
    const lastDist=last?haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],last.lat,last.lon):null;
    const etaCls=eta!=null&&eta<=CONFIG.APPROACHING_ETA_MIN?"urgent":"";
    const etaLine=eta!=null?`<div class="popup-eta ${etaCls}">⏱ Підліт: <b>${formatEta(eta)}</b></div>`:"";
    const distLine=lastDist!=null?`<div class="popup-dist">📏 ${Math.round(lastDist)} км</div>`:"";
    const speedLine=chain.speedKmh?`<div class="popup-speed">⚡ ${chain.speedKmh} км/год</div>`:"";
    // ЦЕЛЬ — самое важное
    let targetLine="";
    if(chain.target){
      const isKyivTgt=isKyivOrOblast(chain.target.name)||haversineKm(chain.target.lat,chain.target.lon,CONFIG.KYIV[0],CONFIG.KYIV[1])<15;
      targetLine=`<div class="popup-target${isKyivTgt?" kyiv":""}">🎯 ЦІЛЬ: ${esc(chain.target.name)}</div>`;
    }
    // Источник
    const srcLine=chain.source?`<div class="popup-meta" style="margin-top:4px">🛫 Звідки: ${esc(chain.source.name)}</div>`:"";
    // История
    const pointsHtml=chain.points.slice(-20).map((p,i)=>{
      const time=new Date(p.t).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
      return`<div class="pt-point"><span class="pt-num">${chain.points.length-Math.min(chain.points.length,20)+i+1}.</span><span class="pt-place">${esc(p.name||"—")}</span><span class="pt-time">${time}</span></div>`;
    }).join("");
    const durationMin=Math.round((chain.lastSeen-chain.firstSeen)/60000);
    const toggleBtn=`<button type="button" class="popup-toggle-btn" data-toggle-trail="${esc(chain._key||"")}">📍 ${chain.polyline?"Приховати траєкторію":"Показати траєкторію"}</button>`;
    const removeBtn=`<button type="button" class="popup-remove-btn" data-remove-key="${esc(chain._key||"")}">🗑 Видалити</button>`;
    return`<div class="popup-title type-${chain.cls.type}">${esc(label)}</div>${targetLine}${etaLine}${distLine}${speedLine}${srcLine}<div style="margin-top:4px">📍 Маршрут: ${chain.points.length} точок · ${durationMin} хв</div><div class="popup-trail"><div style="font-weight:700;margin-bottom:3px">📍 Історія:</div>${pointsHtml}</div>${toggleBtn}${removeBtn}`;
  }
  function buildImpact(r){
    const tt=new Date(r.lastSeen).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
    const chList=[...r.channels].map(ch=>`<span class="ch ${channelClass(ch)}">${esc(ch)}</span>`).join(" ");
    const exactLine=r.exactName?`<div class="popup-exactname">🏷 ${esc(r.exactName)}</div>`:"";
    const key=r._key||"impact";
    return`<div class="popup-title" style="color:${r.report.color}">${r.report.icon} ${esc(r.report.label)}</div>${exactLine}<div class="popup-meta" style="margin-top:5px"><b>${esc(r.name)}</b><br>${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}<br>${r.channels.size} джерел · ${tt}</div><div class="popup-channels"><b>Джерела:</b><br>${chList}</div><button type="button" class="popup-remove-btn" data-remove-kind="impact" data-remove-key="${esc(key)}">🗑 Видалити</button>`;
  }
  return{buildTrail,buildImpact};
})();

/* ========== TRAILS ========== */
function shouldAddTrailPoint(chain,point){
  const last=chain.points[chain.points.length-1];
  if(!last)return true;
  const dist=haversineKm(last.lat,last.lon,point.lat,point.lon);
  const timeDiff=Date.now()-last.t;
  if(dist<CONFIG.TRAIL_MIN_DIST_KM&&timeDiff<CONFIG.TRAIL_MIN_TIME_MS)return false;
  if(dist>=CONFIG.TRAIL_MIN_DIST_KM*3)return true;
  if(chain.points.length>=2){
    const prev=chain.points[chain.points.length-2];
    const b1=bearingBetween(prev.lat,prev.lon,last.lat,last.lon);
    const b2=bearingBetween(last.lat,last.lon,point.lat,point.lon);
    if(Math.abs(((b2-b1+540)%360)-180)>=CONFIG.TRAIL_MIN_ANGLE_DEG)return true;
  }
  if(timeDiff>=CONFIG.TRAIL_MIN_TIME_MS)return true;
  return false;
}
function appendTrailPoint(chainKey,cls,point,ch,msgMs,target,source,exactName){
  let chain=State.trails.get(chainKey);
  if(chain){
    const age=msgMs-chain.lastSeen;
    const dist=chain.points.length?haversineKm(chain.points[chain.points.length-1].lat,chain.points[chain.points.length-1].lon,point.lat,point.lon):0;
    if(age>CONFIG.TRAIL_MAX_AGE_MS||dist>CONFIG.TRAIL_MAX_GAP_KM){State.closeTrail(chainKey);chain=null;}
  }
  if(!chain){
    chain={cls,points:[],firstSeen:msgMs,lastSeen:msgMs,channels:new Set(),markerRef:null,polyline:null,speedKmh:resolveSpeedKmh(cls.type,point.sampleText||""),exactName:exactName||null,target:target||null,source:source||null,_key:chainKey,arrived:false,_trailOpen:false,_userClosed:false};
    State.trails.set(chainKey,chain);
  }
  // Обновляем цель если появилась новая информация
  if(target&&(!chain.target||chain.target.name!==target.name))chain.target=target;
  if(source&&!chain.source)chain.source=source;
  if(exactName&&!chain.exactName)chain.exactName=exactName;
  const last=chain.points[chain.points.length-1];
  const isNew=!last||shouldAddTrailPoint(chain,point);
  if(isNew){
    chain.points.push({...point,t:msgMs,channel:ch,bearingIn:last?bearingBetween(last.lat,last.lon,point.lat,point.lon):null});
    if(chain.points.length>CONFIG.TRAIL_MAX_POINTS)chain.points.shift();
  }
  chain.channels.add(ch);
  chain.lastSeen=msgMs;
  if(chain.polyline)try{chain.polyline.setLatLngs(chain.points.map(p=>[p.lat,p.lon]));}catch(e){}
  return{chain};
}
function ensureTrailVisible(chainKey,forceShow){
  const chain=State.trails.get(chainKey);
  if(!chain)return;
  if(chain.polyline)return;
  if(chain.points.length<2)return;
  if(!map)return;
  const latlngs=chain.points.map(p=>[p.lat,p.lon]);
  chain.polyline=L.polyline(latlngs,{
    color:CONFIG.TRAIL_COLOR,
    weight:CONFIG.TRAIL_LINE_WIDTH,
    opacity:.85,
    lineJoin:"round",lineCap:"round",
    interactive:true,bubblingMouseEvents:false
  }).addTo(map);
  chain.polyline.on("click",(e)=>{
    L.DomEvent.stopPropagation(e);
    hideTrail(chainKey);
    showToast("📍 Траєкторію приховано");
  });
  const ptMarkers=[];
  chain.points.forEach((p,i)=>{
    const m=L.marker([p.lat,p.lon],{
      icon:L.divIcon({className:"",html:`<div style="background:#dc2626;width:6px;height:6px;border-radius:50%;border:1px solid #fff"></div>`,iconSize:[6,6],iconAnchor:[3,3]}),
      interactive:false
    }).addTo(map);
    ptMarkers.push(m);
  });
  if(chain.markerRef)chain.markerRef.trailPoints=ptMarkers;
  chain._trailOpen=true;
}
function hideTrail(chainKey){
  const chain=State.trails.get(chainKey);
  if(!chain)return;
  if(chain.polyline&&map)try{map.removeLayer(chain.polyline);}catch(e){}
  chain.polyline=null;
  if(chain.markerRef?.trailPoints){for(const m of chain.markerRef.trailPoints)try{map.removeLayer(m);}catch(e){}chain.markerRef.trailPoints=null;}
  chain._trailOpen=false;
  chain._userClosed=true;
}
function toggleTrail(chainKey){
  const chain=State.trails.get(chainKey);
  if(!chain)return;
  if(chain.polyline){hideTrail(chainKey);showToast("📍 Траєкторію приховано");return;}
  if(chain.points.length<2){showToast("📍 Поки мало точок");return;}
  chain._userClosed=false;
  ensureTrailVisible(chainKey,true);
  showToast(`📍 Траєкторія · ${chain.points.length} точок`);
}

/* ========== SIMULATION ========== */
function simulateChain(chainKey){
  const chain=State.trails.get(chainKey);
  if(!chain||chain.arrived||chain._simTimer)return;
  const speedKmh=chain.speedKmh||180;
  const kmPerSec=speedKmh/3600;
  chain._simTimer=setInterval(()=>{
    if(chain.arrived||!chain.markerRef?.marker){
      clearInterval(chain._simTimer);chain._simTimer=null;return;
    }
    // Куда летит: если есть цель — летим к цели, иначе к Киеву
    const target=chain.target?{lat:chain.target.lat,lon:chain.target.lon}:{lat:CONFIG.KYIV[0],lon:CONFIG.KYIV[1]};
    const ll=chain.markerRef.marker.getLatLng();
    if(!ll)return;
    const d=haversineKm(ll.lat,ll.lng,target.lat,target.lon);
    if(d<1.5){
      // Достигли цели
      clearInterval(chain._simTimer);chain._simTimer=null;
      chain.cls._arrived=true;chain.arrived=true;
      try{chain.markerRef.marker.setIcon(makeIcon(chain.cls,chain.heading,0,false,true,false));}catch(e){}
      const ref=chain.markerRef.marker;
      setTimeout(()=>{try{threatLayer.removeLayer(ref);}catch(e){}chain.markerRef.marker=null;},CONFIG.ARRIVED_PULSE_MS);
      // Impact marker
      const mkKey="arr_"+Date.now();
      const mk=L.marker([ll.lat,ll.lng],{icon:impactSmallIcon(),zIndexOffset:1500});
      mk.addTo(impactLayer);
      State.impactMarkers.set(mkKey,{marker:mk,eventAt:Date.now()});
      setTimeout(()=>{try{impactLayer.removeLayer(mk);}catch(e){}State.impactMarkers.delete(mkKey);},CONFIG.IMPACT_TTL_MS);
      hideTrail(chainKey);
      Feed.schedule();
      return;
    }
    const brg=bearingBetween(ll.lat,ll.lng,target.lat,target.lon);
    const [nlat,nlon]=destPoint(ll.lat,ll.lng,brg,kmPerSec);
    chain.markerRef.marker.setLatLng([nlat,nlon]);
    chain.heading=brg;
    const onKyiv=haversineKm(nlat,nlon,CONFIG.KYIV[0],CONFIG.KYIV[1])<15;
    chain.markerRef.marker.setIcon(makeIcon(chain.cls,brg,0,false,d<25,onKyiv));
    // ETA alert
    const eta=etaToKyivMin(nlat,nlon,chain.cls.type,speedKmh);
    if(eta!=null&&eta<=CONFIG.APPROACHING_ETA_MIN&&eta>0){
      const lastNotified=State.approachingNotified.get(chainKey)||0;
      if(Date.now()-lastNotified>10*60*1000){
        State.approachingNotified.set(chainKey,Date.now());
        Audio.playAlert(true);
        Alerts.showTargetAlert(chain.target||{name:"Київ",lat:CONFIG.KYIV[0],lon:CONFIG.KYIV[1]},chain.cls);
      }
    }
    // Точки
    const lastPt=chain.points[chain.points.length-1];
    const distMoved=lastPt?haversineKm(lastPt.lat,lastPt.lon,nlat,nlon):Infinity;
    if(distMoved>CONFIG.SIM_TRAIL_MIN_DIST_KM){
      chain.points.push({lat:nlat,lon:nlon,name:chain.target?.name||chain.exactName||"—",t:Date.now(),channel:null});
      if(chain.points.length>CONFIG.TRAIL_MAX_POINTS)chain.points.shift();
      chain.lastSeen=Date.now();
      if(chain.polyline)try{chain.polyline.setLatLngs(chain.points.map(p=>[p.lat,p.lon]));}catch(e){}
    }
  },1000);
}

/* ========== PROCESS MESSAGE ========== */
function syncMessageThreats(messages){
  const now=Date.now();
  const candidates=new Map();
  for(let i=0;i<(messages||[]).length;i++){
    const m=messages[i];
    const text=m.text||"";
    if(!text||text.length<8)continue;
    const ch=(m.channel||"unknown").replace(/^@/,"").toLowerCase();
    const msgMs=m.date?Date.parse(m.date):now;
    // Классификатор
    const cls=CLASSIFIER(text);
    // Ищем место и цель
    const place=findPlaceInText(text);
    if(!place)continue;
    if(!inZone(place.lat,place.lon))continue;
    // Ищем цель (то, что отличается от места, но есть в тексте)
    const targetPlace=findTargetInText(text,place);
    // Источник ("з X")
    const sourcePlace=findSourceInText(text);
    // Ключ
    const key=`msg|${place.key}|${cls?.type||"unknown"}`;
    if(!candidates.has(key))candidates.set(key,{kind:"place",place,target:targetPlace,source:sourcePlace,cls,channels:new Set(),firstSeen:msgMs,lastSeen:msgMs,sampleText:text});
    const c=candidates.get(key);
    c.channels.add(ch);
    if(msgMs<c.firstSeen)c.firstSeen=msgMs;
    if(msgMs>c.lastSeen)c.lastSeen=msgMs;
    if(targetPlace&&!c.target)c.target=targetPlace;
    if(sourcePlace&&!c.source)c.source=sourcePlace;
    // Impact reports
    const impact=extractImpact(text);
    if(impact){
      const ik=`impact|${impact.target.key}`;
      if(State.isDismissed(ik))continue;
      let r=State.impactMarkers.get(ik);
      const rep=detectImpactReports(text)[0]||{kind:"hit",icon:"💥",label:"Вибух",color:"#dc2626"};
      if(!r){
        r={name:impact.target.name,lat:impact.target.lat,lon:impact.target.lon,report:rep,channels:new Set([ch]),firstSeen:msgMs,lastSeen:msgMs,exactName:detectExactName(text),_key:ik};
        State.impactMarkers.set(ik,r);
        const mk=L.marker([r.lat,r.lon],{icon:impactBigIcon(rep.kind),zIndexOffset:880});
        mk.bindPopup(()=>Popup.buildImpact(r),CONFIG.POPUP_OPTS);
        mk.addTo(impactLayer);
        r.marker=mk;
        if(isPriorityChannel(ch))Audio.playAlert(true);
        if(isKyivOrOblast(r.name))Alerts.showTopAlert({kind:"impact",icon:"💥",title:"ПРИЛІТ / ВИБУХ",place:r.name,meta:ch});
        Feed.schedule();
      }
      r.channels.add(ch);
      if(msgMs>r.lastSeen)r.lastSeen=msgMs;
      if(r.marker)try{r.marker.setPopupContent(Popup.buildImpact(r));}catch(e){}
    }
  }
  for(const[key,c]of candidates){
    if(State.isDismissed(key))continue;
    if(!c.cls)continue;
    const chainKey=`trail|${c.place.key}|${c.cls.type}`;
    const exactName=detectExactName(c.sampleText);
    const {chain}=appendTrailPoint(chainKey,c.cls,{lat:c.place.lat,lon:c.place.lon,name:c.place.name,sampleText:c.sampleText,exactName},[...c.channels][0]||"unknown",c.lastSeen,c.target,c.source,exactName);
    const onKyiv=haversineKm(c.place.lat,c.place.lon,CONFIG.KYIV[0],CONFIG.KYIV[1])<15;
    if(!chain.markerRef){
      const marker=L.marker([c.place.lat,c.place.lon],{icon:makeIcon(c.cls,chain.heading,c.channels.size,false,false,onKyiv),zIndexOffset:900});
      marker.bindPopup(()=>Popup.buildTrail(chain),CONFIG.POPUP_OPTS);
      marker.addTo(threatLayer);
      marker.on("click",(e)=>{L.DomEvent.stopPropagation(e);toggleTrail(chainKey);});
      chain.markerRef={marker,trailPoints:null};
      // Если цель = Киев или микрорайон — показываем алерт
      if(c.target&&isKyivOrOblast(c.target.name))Alerts.showTargetAlert(c.target,c.cls);
      // Маркер цели
      if(c.target){
        const tk="target|"+c.target.key;
        ensureTargetMarker(tk,c.target,c.cls);
      }
      simulateChain(chainKey);
      Feed.schedule();
    }else{
      chain.markerRef.marker.setIcon(makeIcon(c.cls,chain.heading,c.channels.size,false,false,onKyiv));
      if(c.target&&isKyivOrOblast(c.target.name))Alerts.showTargetAlert(c.target,c.cls);
    }
  }
}

/* Поиск цели: то, что идёт ПОСЛЕ "на"/"повз"/"у напрямку" и отличается от place */
function findTargetInText(text,currentPlace){
  if(!text)return null;
  const patterns=[
    /(?:курс(?:ом)?\s+на|в\s+напрямку|у\s+напрямку|на\s+підльоті\s+до|летить\s+на|рухається\s+на|прямує\s+на)\s+([А-ЯІЇЄҐа-яіїєґ'’\-]+(?:\s+[А-ЯІЇЄҐа-яіїєґ][а-яіїєґ'’\-]+){0,3})/i,
    /повз\s+([А-ЯІЇЄҐа-яіїєґ'’\-]+(?:\s+[А-ЯІЇЄҐа-яіїєґ][а-яіїєґ'’\-]+){0,2})\s+на\s+([А-ЯІЇЄҐа-яіїєґ'’\-]+(?:\s+[А-ЯІЇЄҐа-яіїєґ][а-яіїєґ'’\-]+){0,2})/i,
    /на\s+([А-ЯІЇЄҐа-яіїєґ'’\-]+(?:\s+[А-ЯІЇЄҐа-яіїєґ][а-яіїєґ'’\-]+){0,3})\s*(?:район|обл|!|\.|,|$)/i,
    /🛵\s*([А-ЯІЇЄҐа-яіїєґ'’\-]+)/i
  ];
  for(const re of patterns){
    const m=re.exec(text);
    if(m){
      // Берём последнюю группу (для многословных)
      const name=m[m.length-1]||m[1];
      if(!name)continue;
      const p=findAnyPlace(name.trim());
      if(p&&p.key!==currentPlace?.key)return p;
      // Если не нашли через findAnyPlace, но это Троєщина/ТЕЦ-5 — они в EXTRA/KYIV_AREAS
      const direct=findPlaceInText(name);
      if(direct&&direct.key!==currentPlace?.key)return direct;
    }
  }
  return null;
}
/* Поиск источника: "з X" / "от X" */
function findSourceInText(text){
  if(!text)return null;
  const patterns=[
    /(?:^|\s)(?:з|із|от|от|від)\s+([А-ЯІЇЄҐ][а-яіїєґ'’\-]+(?:\s+[А-ЯІЇЄҐа-яіїєґ][а-яіїєґ'’\-]+){0,2})/i,
    /(?:^|\s)(?:з|із)\s+([А-ЯІЇЄҐ][а-яіїєґ'’\-]+(?:щини|щині|і|ів|ової))/i
  ];
  for(const re of patterns){
    const m=re.exec(text);
    if(m){
      const p=findAnyPlace(m[1].trim());
      if(p)return p;
    }
  }
  return null;
}

/* ========== API TRACKS ========== */
function upsertThreat(raw){
  if(!threatLayer)return;
  try{
    const t={...raw};
    const txt=[t.type,t.title,t.explanationShort].filter(Boolean).join(" ");
    const cls=CLASSIFIER(txt);
    if(cls?.type==="zircon")t.type="zircon";
    else if(cls?.isJetDrone)t.type="jet_drone";
    else if(cls?.isGeran)t.type=cls.type;
    else if(cls?.type==="ballistic")t.type="ballistic";
    else if(cls&&!TYPE_META[t.type])t.type=cls.type;
    if(t.lat==null||t.lon==null)return;
    if(t.status==="resolved")return;
    if(!inZone(t.lat,t.lon))return;
    const chainKey=`api|${t.id}`;
    const clsObj={type:t.type,label:typeLabel(t),hard:true,_exactName:detectExactName(txt)};
    const existing=State.trails.get(chainKey);
    const msgMs=t.updatedAt?Date.parse(t.updatedAt):Date.now();
    if(existing){
      const last=existing.points[existing.points.length-1];
      const dist=last?haversineKm(last.lat,last.lon,t.lat,t.lon):0;
      if(dist>CONFIG.TRAIL_MIN_DIST_KM||!last){
        existing.points.push({lat:t.lat,lon:t.lon,name:t.locality||t.region||"—",t:msgMs,channel:"api"});
        if(existing.points.length>CONFIG.TRAIL_MAX_POINTS)existing.points.shift();
      }
      existing.lastSeen=msgMs;
      if(existing.markerRef?.marker)existing.markerRef.marker.setLatLng([t.lat,t.lon]);
      if(existing.polyline)try{existing.polyline.setLatLngs(existing.points.map(p=>[p.lat,p.lon]));}catch(e){}
    }else{
      const chain={
        cls:clsObj,points:[{lat:t.lat,lon:t.lon,name:t.locality||t.region||"—",t:msgMs,channel:"api"}],
        firstSeen:msgMs,lastSeen:msgMs,channels:new Set(["api"]),markerRef:null,polyline:null,
        speedKmh:resolveSpeedKmh(t.type,txt),exactName:detectExactName(txt)||null,
        target:null,source:null,
        _key:chainKey,arrived:false,_trailOpen:false,_userClosed:false
      };
      State.trails.set(chainKey,chain);
      const marker=L.marker([t.lat,t.lon],{icon:makeIcon(clsObj,null,0,false,false,false),zIndexOffset:800});
      marker.bindPopup(()=>Popup.buildTrail(chain),CONFIG.POPUP_OPTS);
      marker.addTo(threatLayer);
      marker.on("click",(e)=>{L.DomEvent.stopPropagation(e);toggleTrail(chainKey);});
      chain.markerRef={marker,trailPoints:null};
      simulateChain(chainKey);
      Feed.schedule();
    }
  }catch(e){console.warn("upsert",e);}
}
function typeLabel(t){
  if(t._exactName)return t._exactName;
  if(t.type==="zircon")return"Циркон";
  if(t.type==="geran5")return"Герань-5";
  if(t.type==="geran4")return"Герань-4";
  if(t.type==="geran3")return"Герань-3";
  if(t.type==="geran2")return"Герань-2";
  if(t.type==="ballistic")return detectBallisticClass(t._exactName||"").label;
  const m={missile:"КР",banderol:"S8000",jet_drone:"Реакт. БПЛА",kab:"КАБ",umpb:"УМПБ",fpv:"FPV",uav:"БПЛА",recon:"Розв",mig31k:"МиГ"};
  return m[t.type]||"?";
}

/* ========== FEED ========== */
const Feed=(()=>{
  let timer=null;
  function schedule(){if(timer)return;timer=setTimeout(()=>{timer=null;render();},300);}
  function iconFor(ty){
    if(ty==="zircon"||ty==="ballistic")return"🚨";
    if(ty==="jet_drone")return"⚡";
    if(["geran2","geran3","geran4","geran5"].includes(ty))return"🛸";
    if(["missile","kab","banderol","umpb"].includes(ty))return"🚀";
    return"🛸";
  }
  function colorFor(ty){
    if(ty==="zircon"||ty==="ballistic")return"#d94a8c";
    if(["jet_drone","geran2","geran3","geran4","geran5"].includes(ty))return"#dc2626";
    if(["missile","kab","banderol","umpb"].includes(ty))return"#e55757";
    return"#facc15";
  }
  function collect(){
    const out=[];
    for(const[key,chain]of State.trails){
      if(!chain.markerRef?.marker||chain.arrived)continue;
      const ll=chain.markerRef.marker.getLatLng();
      if(!ll)continue;
      const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],ll.lat,ll.lng);
      const eta=etaToKyivMin(ll.lat,ll.lng,chain.cls.type,chain.speedKmh);
      const meta=getMeta(chain.cls.type);
      out.push({
        kind:"trail",id:key,cls:{type:chain.cls.type,label:chain.exactName||meta.label},
        name:(chain.points[chain.points.length-1]||{}).name||"—",
        target:chain.target,source:chain.source,
        lat:ll.lat,lng:ll.lng,eta,dist:d,ts:chain.lastSeen,
        hasPriority:hasPrioritySource(chain.channels),
        speed:chain.speedKmh,chainKey:key,points:chain.points.length
      });
    }
    out.sort((a,b)=>b.ts-a.ts);
    return out;
  }
  function render(){
    const cont=$("events"),cnt=$("eventCount");
    if(!cont)return;
    const items=collect();
    if(cnt)cnt.textContent=items.length+" подій";
    if(!items.length){cont.innerHTML=`<div class="panel-empty">Немає активних подій</div>`;return;}
    cont.innerHTML=items.slice(0,60).map((it,idx)=>{
      const color=colorFor(it.cls.type);
      const icon=iconFor(it.cls.type);
      const time=new Date(it.ts).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
      let tags="";
      if(it.hasPriority)tags+=`<span class="tag prio">⭐</span>`;
      if(it.speed)tags+=`<span class="tag speed">⚡ ${it.speed}</span>`;
      if(it.eta!=null){
        const cls=it.eta<=CONFIG.APPROACHING_ETA_MIN?"eta-urgent":"";
        tags+=`<span class="tag ${cls}">⏱ ${formatEta(it.eta)}</span>`;
      }
      if(it.dist!=null)tags+=`<span class="tag">📏 ${Math.round(it.dist)} км</span>`;
      if(it.points)tags+=`<span class="tag">📍 ${it.points} тчк</span>`;
      const targetHtml=it.target?`<div class="event-target">🎯 Ціль: ${esc(it.target.name)}</div>`:"";
      const sourceHtml=it.source?`<div style="font-size:10px;color:#94a3b8;margin-top:2px">🛫 ${esc(it.source.name)}</div>`:"";
      return`<div class="event" data-feed-idx="${idx}" style="border-left-color:${color}"><div class="event-top"><div class="event-type" style="color:${color}"><span class="event-icon">${icon}</span>${esc(it.cls.label)}</div><div class="event-time">${time}</div></div><div class="event-loc">📍 ${esc(it.name)}</div>${targetHtml}${sourceHtml}${tags?`<div class="event-meta">${tags}</div>`:''}</div>`;
    }).join("");
    cont.querySelectorAll(".event").forEach(el=>{
      el.addEventListener("click",()=>{
        const it=items[+el.getAttribute("data-feed-idx")];
        if(!it)return;
        if(it.lat!=null)map.setView([it.lat,it.lng],12,{animate:true});
      });
    });
  }
  return{schedule,render,collect,iconFor,colorFor};
})();

function buildSettlementsLayer(){

  const max=z>=13?9999:(z>=12?400:150);

    L.marker([rec.lat,rec.lon],{icon,interactive:false,zIndexOffset:100}).addTo(settlementsLayer);

/* ========== NET ========== */
const Net=(()=>{
  let ws=null,wsConnected=false,wsReconnectMs=CONFIG.WS_RECONNECT_MS,wsReconnectTimer=null;
  let restFallback=false,pollTimer=null,abortCtrl=null;
  function scheduleReconnect(){if(wsReconnectTimer)return;wsReconnectTimer=setTimeout(()=>{wsReconnectTimer=null;connect();},wsReconnectMs);wsReconnectMs=Math.min(wsReconnectMs*2,CONFIG.WS_RECONNECT_MAX_MS);}
  function connect(){
    try{
      if(ws){try{ws.close();}catch(e){}ws=null;}
      ws=new WebSocket(CONFIG.WS_URL);
      ws.onopen=()=>{wsConnected=true;wsReconnectMs=CONFIG.WS_RECONNECT_MS;restFallback=false;stopPolling();updateBadge("ok");};
      ws.onmessage=e=>{try{handleFrame(JSON.parse(e.data));}catch(err){}};
      ws.onerror=()=>{};
      ws.onclose=()=>{wsConnected=false;ws=null;updateBadge("err");if(!restFallback){restFallback=true;startPolling();}scheduleReconnect();};
    }catch(e){if(!restFallback){restFallback=true;startPolling();}scheduleReconnect();}
  }
  const wsState={threats:new Map()};
  function handleFrame(env){
    if(!env||!env.type)return;
    switch(env.type){
      case"snapshot":{const data=env.data||{};wsState.threats.clear();for(const tx of(data.threats||[]))if(tx.id)wsState.threats.set(tx.id,tx);syncThreats([...wsState.threats.values()]);break;}
      case"upsert":{const tx=env.data;if(tx&&tx.id){wsState.threats.set(tx.id,tx);syncThreats([...wsState.threats.values()]);}break;}
      case"remove":{const data=env.data||{};if(data.id)wsState.threats.delete(data.id);syncThreats([...wsState.threats.values()]);break;}
    }
  }
  async function fetchMessages(){
    try{
      const r=await fetch(CONFIG.API_MESSAGES);
      if(!r.ok)throw 0;
      const d=await r.json();
      syncMessageThreats(d.messages||[]);
    }catch(e){}
  }
  async function fetchThreats(){
    try{
      if(abortCtrl)abortCtrl.abort();
      abortCtrl=new AbortController();
      const r=await fetch(CONFIG.API_THREATS,{signal:abortCtrl.signal});
      if(!r.ok)throw 0;
      const d=await r.json();
      syncThreats(d.threats||[]);
      updateBadge("ok");
    }catch(e){if(e.name!=="AbortError")updateBadge("err");}
  }
  function syncThreats(list){for(const tx of list||[])upsertThreat(tx);}
  async function pollLoop(){await fetchThreats();await fetchMessages();pollTimer=setTimeout(pollLoop,CONFIG.POLL_MS);}
  function startPolling(){if(pollTimer)clearTimeout(pollTimer);pollLoop();}
  function stopPolling(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}if(abortCtrl){abortCtrl.abort();abortCtrl=null;}}
  function updateBadge(state){
    const d=$("statusDot"),t=$("statusText");
    if(!d||!t)return;
    d.className="status-dot"+(state==="err"?" err":state==="warn"?" warn":"");
    t.textContent=state==="err"?"ОФЛАЙН":(wsConnected?"ONLINE · WS":"ONLINE");
  }
  return{connect,startPolling,stopPolling,fetchMessages,isConnected:()=>wsConnected};
})();

    q=(q||"").trim();if(q.length<2){hide();return;}
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=8&accept-language=uk,en`);
      const data=await r.json();
      show((data||[]).map(d=>({name:d.display_name.split(",")[0]||"?",addr:d.display_name,lat:+d.lat,lon:+d.lon})));
    }catch(e){}
  }
  btn.addEventListener("click",()=>doSearch(input.value));
  input.addEventListener("keydown",e=>{if(e.key==="Enter")doSearch(input.value);});
  input.addEventListener("input",()=>{clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>doSearch(input.value),400);});
}
function initUserMarkers(){
  const MK="kyiv_radar_user_markers_v1";let addMode=false,userMarkers=[],layer=null;
  const btn=$("btnMarkers");if(!btn||!map)return;
  try{userMarkers=JSON.parse(localStorage.getItem(MK)||"[]");}catch(e){userMarkers=[];}
  function save(){try{localStorage.setItem(MK,JSON.stringify(userMarkers));}catch(e){}}
  function makeIcon(){return L.divIcon({className:"",html:`<div style="background:#ea580c;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff"></div>`,iconSize:[18,18],iconAnchor:[9,18]});}
  function render(){
    if(layer)layer.clearLayers();else layer=L.layerGroup().addTo(map);
    userMarkers.forEach(m=>{
      const mk=L.marker([m.lat,m.lng],{icon:makeIcon(),draggable:true}).addTo(layer);
      mk.on("dragend",()=>{const ll=mk.getLatLng();m.lat=ll.lat;m.lng=ll.lng;save();});
    });
  }
  btn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();Audio.unlock();addMode=!addMode;btn.classList.toggle("on",addMode);map.getContainer().style.cursor=addMode?"crosshair":"";showToast(addMode?"Клікніть на карту":"Вимкнено");});
  map.on("click",e=>{if(!addMode)return;const m={id:Date.now()+"_"+Math.random().toString(36).slice(2,7),lat:e.latlng.lat,lng:e.latlng.lng};userMarkers.push(m);save();render();});
  render();
}
function initFullscreen(){
  const btn=$("btnFullscreen");if(!btn)return;
  btn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();Audio.unlock();try{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}catch(err){showToast("Fullscreen недоступний");}});
}
function initHistory(){
  const HK="kyiv_radar_event_history_v1";const MAX=80;let history=[];
  const panel=$("historyPanel"),list=$("historyList"),btn=$("btnHistory"),closeBtn=$("historyClose");
  if(!panel||!list||!btn)return;
  try{history=JSON.parse(localStorage.getItem(HK)||"[]");}catch(e){history=[];}
  function save(){try{localStorage.setItem(HK,JSON.stringify(history.slice(0,MAX)));}catch(e){}}
  function render(){
    if(!history.length){list.innerHTML=`<div style="padding:12px;color:#7a8f9e;font-size:12px">Порожньо</div>`;return;}
    list.innerHTML=history.map((h,i)=>`<div class="history-item" data-i="${i}"><div class="hi-time">${new Date(h.ts).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"})}</div><div>${esc(h.label)}</div><div class="hi-loc">📍 ${esc(h.name)}</div></div>`).join("");
    list.querySelectorAll(".history-item").forEach(el=>el.addEventListener("click",()=>{const h=history[+el.dataset.i];if(h?.lat!=null)map.setView([h.lat,h.lng],12);}));
  }
  window.addToHistory=function(item){if(!item)return;history.unshift({ts:Date.now(),label:item.cls?.label||"?",name:item.name||"—",lat:item.lat,lng:item.lng});if(history.length>MAX)history.length=MAX;save();if(panel.classList.contains("show"))render();};
  btn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();Audio.unlock();const show=!panel.classList.contains("show");panel.classList.toggle("show",show);btn.classList.toggle("on",show);if(show)render();});
  closeBtn?.addEventListener("click",()=>{panel.classList.remove("show");btn.classList.remove("on");});
}

/* ========== INIT ========== */
async function init(){
  try{
    setStatus("warn","ЗАГРУЗКА…");
    initMap();
    initUI();
    initSearch();
    initUserMarkers();
    initFullscreen();
    initHistory();
    applyScope(false);
    Net.connect();
    Net.fetchMessages();
    setInterval(Net.fetchMessages,5000);
    Feed.render();
    setInterval(Feed.render,8000);
    setTimeout(()=>Audio.unlock(),500);
    showToast("🛡 KYIV OSINT RADAR v15.4",2500);
  }catch(e){console.warn("init",e);}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>
